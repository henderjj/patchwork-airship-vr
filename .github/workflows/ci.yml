name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Install Chromium for the emulated-headset test
        run: npx playwright install --with-deps chromium
      - name: Emulated-headset smoke test
        run: npm run test:xr
      # Stop the emulated headset first: its browser keeps rendering and the
      # runner's two CPUs are needed for the four software-rendered pages.
      - name: Stop the dev runtime
        if: always()
        run: npx iwsdk dev down || true
      - name: Two-player network test
        run: npm run test:net
      - name: Typecheck the lobby worker
        run: npm ci --prefix lobby && npm run --prefix lobby typecheck
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: test-artifacts
          path: |
            artifacts/*.png
            artifacts/net-report.json
          if-no-files-found: ignore

  deploy:
    # Every main-branch build goes to GitHub Pages so a headset can open it by URL.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          NODE_ENV: production
          # The deployed crew lobby (wss://...), set under Settings → Secrets and variables → Actions → Variables.
          VITE_LOBBY_URL: ${{ vars.LOBBY_URL }}
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
